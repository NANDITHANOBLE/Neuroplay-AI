[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroplay-ai"
version = "0.1.0"
description = "Adaptive Human Behavior Prediction and Strategy Intelligence Platform"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = [
    "src/neuroplay/cv/*",
    "src/neuroplay/models/train_*.py",
    "src/neuroplay/models/run_baselines.py",
    "src/neuroplay/eda/visualizations.py",
    "src/neuroplay/explainability/plot_explanations.py",
    "src/neuroplay/explainability/run_explainability.py",
    "src/neuroplay/evaluation/run_full_evaluation.py",
    "src/neuroplay/drift/run_drift_detection.py",
    "src/neuroplay/rl/train_dqn.py",
    "src/neuroplay/db/export_selfplay_data.py",
    "src/neuroplay/preprocessing/preprocess_pipeline.py",
    "src/neuroplay/features/feature_pipeline.py",
    "src/neuroplay/data_generation/generate_dataset.py",
    "src/neuroplay/data_generation/simulator.py",
]
