version: "3.9"

services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./data/neuroplay.db
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - NEUROPLAY_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
